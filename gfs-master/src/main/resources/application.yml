spring:
  application:
    name: gfs-master
  main:
    banner-mode: off
    web-application-type: none

grpc:
  server:
    port: ${GFS_GRPC_PORT:9000}

gfs:
  master:
    heartbeat-timeout-ms: 4000     # no heartbeat for this long => server considered DEAD
    lease-duration-ms: 5000        # primary lease; renewed by each primary heartbeat
    replication-factor: ${GFS_REPLICATION_FACTOR:3}
    startup-grace-ms: 3000         # after boot: no elections / repairs until servers re-report
    repair-quiet-ms: 3000          # only repair a chunk that has had no writes for this long
    repair-timeout-ms: 30000       # give up on an unfinished copy order after this long
    max-repairs-per-tick: 4        # throttle: copy orders issued per 500 ms tick
    # No server list: chunkservers register themselves with their first heartbeat.

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{24} - %msg%n"