name: gfs

x-chunkserver: &chunkserver
  image: gfs-chunkserver:0.1.0
  build:
    context: .
    target: chunkserver
  depends_on:
    - master

services:
  master:
    image: gfs-master:0.1.0
    build:
      context: .
      target: master
    container_name: gfs-master
    environment:
      GFS_GRPC_PORT: "9000"
      # Replication factor is the ONLY cluster-shape setting left. There is no server list:
      # chunkservers register themselves. Override with:  GFS_REPLICATION_FACTOR=2 docker compose up -d
      GFS_REPLICATION_FACTOR: "${GFS_REPLICATION_FACTOR:-3}"

  cs1:
    <<: *chunkserver
    container_name: gfs-cs1
    environment:
      GFS_SERVER_ID: cs1
      GFS_GRPC_PORT: "9101"
      GFS_ADVERTISE_HOST: cs1      # how other containers reach this one (compose service name)
      GFS_MASTER_HOST: master
      GFS_MASTER_PORT: "9000"
    volumes:
      - cs1-data:/data

  cs2:
    <<: *chunkserver
    container_name: gfs-cs2
    environment:
      GFS_SERVER_ID: cs2
      GFS_GRPC_PORT: "9102"
      GFS_ADVERTISE_HOST: cs2
      GFS_MASTER_HOST: master
      GFS_MASTER_PORT: "9000"
    volumes:
      - cs2-data:/data

  cs3:
    <<: *chunkserver
    container_name: gfs-cs3
    environment:
      GFS_SERVER_ID: cs3
      GFS_GRPC_PORT: "9103"
      GFS_ADVERTISE_HOST: cs3
      GFS_MASTER_HOST: master
      GFS_MASTER_PORT: "9000"
    volumes:
      - cs3-data:/data

  # Not started by the commands below. Start it later to prove dynamic registration:
  #   docker compose up -d cs4
  cs4:
    <<: *chunkserver
    container_name: gfs-cs4
    environment:
      GFS_SERVER_ID: cs4
      GFS_GRPC_PORT: "9104"
      GFS_ADVERTISE_HOST: cs4
      GFS_MASTER_HOST: master
      GFS_MASTER_PORT: "9000"
    volumes:
      - cs4-data:/data

  # CLI client. Not started by `up`; run with: docker compose run --rm client <args>
  client:
    image: gfs-client:0.1.0
    build:
      context: .
      target: client
    profiles: ["tools"]
    depends_on:
      - master
    environment:
      GFS_MASTER_HOST: master
      GFS_MASTER_PORT: "9000"

volumes:
  cs1-data:
  cs2-data:
  cs3-data:
  cs4-data: